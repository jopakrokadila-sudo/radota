<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 15px; }
        .card { background: #1c1c1c; border-radius: 10px; padding: 15px; margin-bottom: 10px; border-left: 4px solid #0088cc; }
        .btn-send { background: #0088cc; color: #fff; border: none; width: 100%; padding: 10px; border-radius: 5px; font-weight: bold; margin-top: 10px; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; border-top: 1px solid #333; padding-top: 20px; }
        .stat-item { background: #1c1c1c; padding: 15px; border-radius: 10px; text-align: center; }
        .val { display: block; font-size: 24px; font-weight: bold; color: #0088cc; }
        .label { font-size: 10px; color: #666; }
    </style>
</head>
<body>
    <h2 style="text-align:center">Заявки CRM</h2>
    <div id="leads-container">Загрузка...</div>

    <h2 style="text-align:center; margin-top:30px">Статистика</h2>
    <div class="stats">
        <div class="stat-item"><span class="val" id="total">0</span><span class="label">ВСЕГО</span></div>
        <div class="stat-item"><span class="val" id="fires" style="color:red">0</span><span class="label">ОПОЗДАНИЯ</span></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        async function load() {
            try {
                const r = await fetch("https://kvdb.io/6P8S5q9S8Q8S9q8S8Q8S9q/rabotka_data_v1");
                const d = await r.json();
                
                const cont = document.getElementById('leads-container');
                cont.innerHTML = '';
                d.leads.forEach(l => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `<b>№${l.id}</b> <small style="float:right">${l.date}</small><br><p style="font-size:13px">${l.text}</p>
                                     <button class="btn-send" onclick="send('${l.text}')">✈️ ПЕРЕСЛАТЬ</button>`;
                    cont.appendChild(div);
                });

                document.getElementById('total').innerText = d.stats.total;
                document.getElementById('fires').innerText = d.stats.fires;
            } catch(e) {}
        }
        function send(t) { tg.switchInlineQuery(t); }
        tg.ready();
        setInterval(load, 5000);
        load();
    </script>
</body>
</html>
