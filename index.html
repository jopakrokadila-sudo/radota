<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Elite Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg-color: #0f1012; --card-bg: #1e2126; --accent: #0088cc; --danger: #ff4d4d; --success: #00c853; --text: #ffffff; --secondary-text: #a0a0a0; }
        body { font-family: sans-serif; background: var(--bg-color); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; min-height: 100vh; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { margin: 0; color: var(--accent); text-transform: uppercase; font-size: 20px; }
        .section-title { font-size: 14px; color: var(--secondary-text); text-transform: uppercase; margin-bottom: 15px; font-weight: bold; }
        #order-list { flex-grow: 1; margin-bottom: 30px; }
        .order-card { background: var(--card-bg); border-radius: 18px; padding: 18px; margin-bottom: 15px; border: 1px solid #333; }
        .order-id { font-size: 18px; font-weight: 800; margin-bottom: 8px; color: var(--accent); }
        .order-desc { font-size: 15px; line-height: 1.4; color: #e0e0e0; margin-bottom: 15px; }
        .btn-send { background: linear-gradient(135deg, #0088cc, #005580); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        .stats-container { background: var(--card-bg); border-radius: 20px; padding: 25px; border: 1px solid #444; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 32px; font-weight: 900; display: block; margin-bottom: 5px; }
        .stat-label { font-size: 12px; color: var(--secondary-text); text-transform: uppercase; }
        .stat-requests .stat-value { color: var(--success); }
        .stat-fires .stat-value { color: var(--danger); }
        .empty-msg { text-align: center; color: var(--secondary-text); padding: 20px; font-style: italic; }
    </style>
</head>
<body>
    <div class="header"><h2>Rabotka Management</h2></div>
    
    <div class="section-title">📥 Текущие заявки</div>
    <div id="order-list">
        <div class="empty-msg">Ожидание данных из CRM...</div>
    </div>

    <div class="section-title">📊 Итоги смены</div>
    <div class="stats-container">
        <div class="stat-item stat-requests">
            <span class="stat-value" id="total-req">0</span>
            <span class="stat-label">Заявки</span>
        </div>
        <div class="stat-item stat-fires">
            <span class="stat-value" id="total-fires">0</span>
            <span class="stat-label">Опоздания</span>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        function shareOrder(id, text) {
            tg.HapticFeedback.impactOccurred('medium');
            tg.switchInlineQuery(`🛠 ЗАКАЗ #${id}\n\n${text}`);
        }

        // Функция, которую будет вызывать твой скрипт Tampermonkey
        window.addEventListener('message', function(event) {
            const data = event.data;
            if (data.type === 'updateStats') {
                document.getElementById('total-req').innerText = data.requests;
                document.getElementById('total-fires').innerText = data.fires;
            }
            if (data.type === 'newOrder') {
                const list = document.getElementById('order-list');
                if(list.querySelector('.empty-msg')) list.innerHTML = '';
                
                const card = document.createElement('div');
                card.className = 'order-card';
                card.innerHTML = `
                    <div class="order-id">ЗАЯВКА #${data.id}</div>
                    <div class="order-desc">${data.text}</div>
                    <button class="btn-send" onclick="shareOrder('${data.id}', '${data.text}')">🚀 Переслать мастеру</button>
                `;
                list.prepend(card);
            }
        });
    </script>
</body>
</html>
