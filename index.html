<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 15px; }
        .card { background: #1c1c1c; border-radius: 10px; padding: 15px; margin-bottom: 12px; border-left: 4px solid #0088cc; }
        .btn-send { background: #0088cc; color: #fff; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 10px; }
        
        /* Анимация точек */
        .loading:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60% { content: '...'; }
            80%, 100% { content: ''; }
        }
        
        .loader-text { text-align: center; color: #666; margin-top: 50px; font-size: 18px; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; border-top: 1px solid #333; padding-top: 20px; }
        .stat-item { background: #1c1c1c; padding: 15px; border-radius: 10px; text-align: center; }
        .val { display: block; font-size: 24px; font-weight: bold; color: #0088cc; }
        .label { font-size: 10px; color: #666; }
    </style>
</head>
<body>
    <h2 style="text-align:center">Заявки CRM</h2>
    <div id="leads-container" class="loader-text">Загрузка данных из CRM<span class="loading"></span></div>

    <div class="stats">
        <div class="stat-item"><span class="val" id="total">0</span><span class="label">ВСЕГО</span></div>
        <div class="stat-item"><span class="val" id="fires" style="color:red">0</span><span class="label">ОПОЗДАНИЯ</span></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const KVDB_URL = "https://kvdb.io/6P8S5q9S8Q8S9q8S8Q8S9q/rabotka_data_v1";

        async function load() {
            try {
                const r = await fetch(KVDB_URL + "?t=" + Date.now()); // Добавили t=, чтобы данные не кешировались
                if (!r.ok) throw new Error("Нет данных");
                
                const d = await r.json();
                const cont = document.getElementById('leads-container');
                
                if (!d.leads || d.leads.length === 0) {
                    cont.innerHTML = "Данных пока нет. Открой CRM с запущенным Tampermonkey.";
                    return;
                }

                cont.innerHTML = '';
                d.leads.forEach(l => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `
                        <b>№${l.id}</b> <small style="float:right; color:#666">${l.date}</small><br>
                        <p style="font-size:14px; margin: 10px 0;">📍 ${l.address}</p>
                        <div style="font-size:12px; color:#0088cc">Статус: ${l.status}</div>
                        <button class="btn-send" onclick="send('${l.id}', '${l.address}')">✈️ ПЕРЕСЛАТЬ</button>
                    `;
                    cont.appendChild(div);
                });

                document.getElementById('total').innerText = d.stats.total || 0;
                document.getElementById('fires').innerText = d.stats.fires || 0;
            } catch(e) {
                console.log("Ошибка:", e);
            }
        }

        function send(id, addr) {
            tg.sendData(`Заявка №${id} по адресу: ${addr}`);
        }

        tg.ready();
        setInterval(load, 5000);
        load();
    </script>
</body>
</html>
