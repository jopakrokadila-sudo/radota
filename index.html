<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rabotka Management</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0b0e11; --card: #171a1f; --accent: #0088cc; --text: #ffffff; --danger: #ff4d4d; }
        body { font-family: -apple-system, blinkmacsystemfont, sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; }
        
        /* Заявки */
        .lead-card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #2d333b; }
        .lead-id { font-weight: bold; color: var(--accent); font-size: 16px; }
        .lead-info { font-size: 13px; color: #9ea7b3; margin: 8px 0; line-height: 1.5; }
        .btn-send { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 5px; }
        
        /* Статистика */
        .stats-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #2d333b; }
        .stat-val { font-size: 24px; font-weight: bold; color: var(--accent); display: block; }
        .stat-label { font-size: 10px; color: #666; text-transform: uppercase; margin-top: 4px; }
        
        .header { text-align: center; margin-bottom: 20px; font-size: 18px; font-weight: bold; }
        .section-title { font-size: 12px; color: #555; margin: 20px 0 10px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="header">Rabotka Management</div>

    <div class="section-title">Список заявок</div>
    <div id="leads-list">Загрузка данных из CRM...</div>

    <div class="section-title">Вся статистика</div>
    <div class="stats-box">
        <div class="stat-card"><span class="stat-val" id="total">0</span><span class="stat-label">Заявки в работе</span></div>
        <div class="stat-card"><span class="stat-val" id="fires" style="color:var(--danger)">0</span><span class="stat-label">Опоздания</span></div>
        <div class="stat-card" style="grid-column: span 2;">
            <span class="stat-val" id="closed" style="color:#28a745">0</span>
            <span class="stat-label">Закрыто заявок за сегодня</span>
        </div>
    </div>

    <div style="text-align:center; font-size:10px; color:#333; margin-top:20px;">
        Последнее обновление: <span id="time">--:--:--</span>
    </div>

    <script>
        const bridgeKey = 'rabotka_data_v1';
        const tg = window.Telegram.WebApp;

        async function update() {
            try {
                const r = await fetch("https://kvdb.io/6P8S5q9S8Q8S9q8S8Q8S9q/" + bridgeKey);
                const data = await r.json();

                const list = document.getElementById('leads-list');
                list.innerHTML = '';

                data.leads.forEach(l => {
                    const card = document.createElement('div');
                    card.className = 'lead-card';
                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between">
                            <span class="lead-id">№${l.id}</span>
                            <span style="font-size:11px; color:#555">${l.date}</span>
                        </div>
                        <div class="lead-info">${l.text}</div>
                        <button class="btn-send" onclick="sendToTG('${l.text}')">✈️ ПЕРЕСЛАТЬ</button>
                    `;
                    list.appendChild(card);
                });

                document.getElementById('total').innerText = data.stats.total;
                document.getElementById('fires').innerText = data.stats.fires;
                document.getElementById('closed').innerText = data.stats.closed;
                document.getElementById('time').innerText = data.stats.lastUpdate;

            } catch(e) { console.log("Связь устанавливается..."); }
        }

        function sendToTG(text) {
            tg.switchInlineQuery(text);
        }

        tg.ready();
        tg.expand();
        setInterval(update, 5000);
        update();
    </script>
</body>
</html>
